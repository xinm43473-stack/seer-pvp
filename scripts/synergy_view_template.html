  const zout = bar.querySelector('[data-z="out"]'); if(zout) zout.disabled = k <= ZOOM_MIN + 1e-6;
}
/* 详情页体系图：用 zoom（改变布局尺寸），缩小时 .gwrap 的滚动范围跟着缩小，
   放大时自动出现滚动条；节点坐标仍按原始 px，不受影响。 */
function applyGraphZoom(box, k){
  if(!box) return 1;
  const v = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Number(k) || 1));
  const inner = box.querySelector(".ginner");
  if(inner) inner.style.zoom = v;
  paintZoomBar(box.querySelector(".gzoom"), v);
  return v;
}
function applyGraphZoomAll(){
  document.querySelectorAll("#systemsView .gbox").forEach(box => {
    applyGraphZoom(box, zoomGet("sys:" + (box.getAttribute("data-gkey") || "")));
  });
}
/* 体系管理画布：缩放挂在 #sysStage 上（画布自身尺寸不变，放大后可滚动平移） */
let sysZoom = zoomGet("editor");
// 用户没手动调过缩放时，打开体系就自动缩到「看得全」（只缩不放）
let sysZoomAuto = !Object.prototype.hasOwnProperty.call(zoomStore, "editor");
function applySysZoom(){
  const stage = $("sysStage");
  if(stage){
    stage.style.transform = Math.abs(sysZoom - 1) < 1e-6 ? "" : "scale(" + sysZoom + ")";
  }
  paintZoomBar($("sysZoomBar"), sysZoom);
}
function setSysZoom(k){
  sysZoomAuto = false;                       // 手动调过就不再自动适配
  sysZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(k * 100) / 100));
  zoomSet("editor", sysZoom);
  applySysZoom();
}
function autoFitSysZoom(){
  if(!sysZoomAuto) return;
  const k = Math.max(ZOOM_MIN, Math.min(1, Math.round(sysFitK() * 100) / 100));
  if(Math.abs(k - sysZoom) < 0.005) return;
  sysZoom = k;
  applySysZoom();
}
function graphFitK(box){
  const wrap = box.querySelector(".gwrap"), inner = box.querySelector(".ginner");
  if(!wrap || !inner || !inner.offsetWidth) return 1;
  return Math.min(1, (wrap.clientWidth - 6) / inner.offsetWidth);
}
function sysFitK(){
  const canvas = $("sysCanvas");
  if(!canvas) return 1;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  if(!cw || !ch) return 1;
  const bw = Math.max(140, ...(graph.nodes || []).map(n => (Number(n.x) || 0) + GEO.editW + 10),
    ...((graph.skills || []).map(s => (Number(s.x) || 0) + (s.w || GEO.skW) + 10)),
    ...((graph.notes || []).map(n => (Number(n.x) || 0) + 230)));
  const bh = Math.max(140, ...(graph.nodes || []).map(n => (Number(n.y) || 0) + GEO.editH + 24),
    ...((graph.skills || []).map(s => (Number(s.y) || 0) + (s.h || GEO.skH) + 24)),
    ...((graph.notes || []).map(n => (Number(n.y) || 0) + 90)));
  return Math.min(1, cw / bw, ch / bh);
}
/* 备注文本宽度随文本变化，图鉴是拼字符串渲染的，拿不到实测尺寸；
   先在隐藏容器里用同一套 .cnote 样式量一遍，端点才能像编辑器那样贴边。 */
function measureNotes(rows){
  const out = new Map();
  if(!rows.length) return out;
  const box = document.createElement("div");
  box.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none";
  document.body.appendChild(box);
  try{
    rows.forEach(n => {
      const el = document.createElement("div");
      el.className = "cnote";
      el.style.position = "static";
      el.textContent = String(n.text || "");
      box.appendChild(el);
      out.set(String(n.id), {w: el.offsetWidth || GEO.noteW, h: el.offsetHeight || GEO.noteH});
    });
  }finally{ box.remove(); }
  return out;
}
function graphView(ids, edges, canvas, key){
  const uniq = [...new Set(ids.map(String))];
  const canvasSkills = (canvas && Array.isArray(canvas.skills)) ? canvas.skills : [];
  const skillSeed = canvasSkills.map(s => ({key: String(s.key), pet: Number(s.pet),
    sid: Number(s.sid) || 0, name: String(s.name || ""),
    x: Number(s.x) || 0, y: Number(s.y) || 0}));
  const layout = graphLayout(uniq, canvas, skillSeed);
  const pos = layout.pts, skillPos = layout.extra || [];
  const byId = new Map(pos.map(p => [p.id, p]));
  // 图鉴只读回放编辑器里设过的线色；没设色的线仍是主题默认色
  const canvasColors = (canvas && canvas.edge_colors) || {};
  const colorOf = (a, b) => normColor(canvasColors[edgeKeyOf(a, b)]);
  const lines = [], labelItems = [];
  // 三类边（精灵↔精灵／技能卡／备注文本）统一走 edgeModels：
  // 端点一律按「卡片边框 + 5px」内缩，编辑器与图鉴因此完全一致。
  const SK_W = GEO.skW, SK_H = GEO.skH;
  const byKey = new Map(skillPos.map(s => [s.key, s]));
  const notePos = new Map(((layout && layout.notes) || []).map(n => [String(n.id), n]));
  const noteSize = measureNotes(layout.notes || []);
  const skPet = new Map(skillPos.map(s => [s.key, String(s.pet)]));
  const skPetOf = k => skPet.get(String(k));
  const linkNotes = (canvas && canvas.link_notes) || {};
  const linkNoteOf = (a, b) => String(linkNotes[edgeKeyOf(a, b)] || "").trim();
  const endName = k => {
    const pet = byId.get(String(k));
    if(pet) return (nodeOf(String(k)) || {}).name || ("#" + k);
    const sk = byKey.get(String(k));
    if(sk) return ((resolveSkill(sk) || {}).n) || sk.name || "技能";
    const nt = notePos.get(String(k));
    return nt ? "备注文本：" + short(String(nt.text || ""), 12) : String(k);
  };
  const endOf = k => {
    const pet = byId.get(String(k));
    if(pet) return {x: pet.x + GEO.nodeCx, y: pet.y + GEO.nodeCy, w: GEO.nodeW, h: GEO.nodeH};
    const sk = byKey.get(String(k));
    if(sk) return {x: sk.x + SK_W/2, y: sk.y + SK_H/2, w: SK_W, h: SK_H};
    const nt = notePos.get(String(k));
    if(!nt) return null;
    const sz = noteSize.get(String(k)) || {w: GEO.noteW, h: GEO.noteH};
    return {x: (Number(nt.x) || 0) + sz.w/2, y: (Number(nt.y) || 0) + sz.h/2, w: sz.w, h: sz.h};
  };
  edgeModels(edges, endOf, skPetOf).forEach(m => {
    const {e, seg} = m;
    lines.push(`<line${edgeStyleAttr(colorOf(e.a, e.b), "pet")} x1="${seg.sx}" y1="${seg.sy}" x2="${seg.ex}" y2="${seg.ey}"></line>`);
    const note = String(e.note || "").trim();
    // 无字备注不画气泡（以前会留一个「—」占位），连线本身照常画。
    if(!note) return;
    const la = nodeOf(String(e.a)), lb = nodeOf(String(e.b));
    // 全文显示 + CSS 自动换行，不再截断成 18 字；图下方纯文字关系列表已删除。
    labelItems.push({x: seg.mx, y: seg.my - 12, text:note,
      label: (la ? la.name : "#" + e.a) + " → " + (lb ? lb.name : "#" + e.b)});
  });
  // 技能卡连线：与编辑器同一套端点/笔型判定
  ((canvas && canvas.skill_links) || []).forEach(pair => {
    if(!Array.isArray(pair) || pair.length !== 2) return;
    edgeModels([{a: pair[0], b: pair[1]}], endOf, skPetOf).forEach(m => {
      const {e, own, seg} = m;
      lines.push(`<line class="gskill${own ? " own" : ""}"${edgeStyleAttr(colorOf(e.a, e.b), "skill")} x1="${seg.sx}" y1="${seg.sy}" x2="${seg.ex}" y2="${seg.ey}"></line>`);
      const skNote = linkNoteOf(e.a, e.b);
      if(skNote) labelItems.push({x: seg.mx, y: seg.my - 12, text: skNote,
        label: endName(e.a) + " → " + endName(e.b)});
    });
  });
  // 备注文本连线：编辑器里备注文本可当端点，图鉴按 canvas.note_links 只读回放
  const noteLinks = (canvas && Array.isArray(canvas.note_links)) ? canvas.note_links : [];
  noteLinks.forEach(l => {
    if(!l || !l.a || !l.b) return;
    edgeModels([{a: l.a, b: l.b}], endOf, skPetOf).forEach(m => {
      const {e, seg} = m;
      lines.push(`<line class="gnote"${edgeStyleAttr(colorOf(e.a, e.b), "note")} x1="${seg.sx}" y1="${seg.sy}" x2="${seg.ex}" y2="${seg.ey}"></line>`);
      const ntNote = linkNoteOf(e.a, e.b) || String(l.note || "").trim();
      if(ntNote) labelItems.push({x: seg.mx, y: seg.my - 12, text: ntNote,
        label: endName(e.a) + " → " + endName(e.b)});
    });
  });
  const linkedNoteIds = new Set();
  noteLinks.forEach(l => {
    if(!l) return;
    if(notePos.has(String(l.a))) linkedNoteIds.add(String(l.a));
    if(notePos.has(String(l.b))) linkedNoteIds.add(String(l.b));
  });
  const labelPos = layoutEdgeLabels(labelItems, pos.map(p2 => ({x:p2.x, y:p2.y, w:GEO.nodeW, h:GEO.nodeH}))
    .concat(skillPos.map(s => ({x:s.x, y:s.y, w:SK_W, h:SK_H})))
    .concat(((layout && layout.notes) || []).filter(n => linkedNoteIds.has(String(n.id)))
      .map(n => ({x:Number(n.x)||0, y:Number(n.y)||0, w:GEO.noteW, h:GEO.noteH}))));
  labelItems.forEach((it, i) => {
    const r = labelPos[i];
    if(!r.lead || r.side) return;
    lines.push(`<line class="glead"${edgeStyleAttr("", "lead")} x1="${it.x}" y1="${it.y + 12}" x2="${r.x}" y2="${r.y}"></line>`);
  });
  const labels = labelItems.map((it,i) => {
    const r = labelPos[i];
    const head = r.side && it.label ? `<div class="gl-head">${esc(it.label)}</div>` : "";
    return `<div class="glabel" style="left:${r.x}px;top:${r.y}px">${head}${esc(it.text)}</div>`;
  });
  // 备注文本跟着节点一起缩放/平移（否则图鉴里的位置会和编辑器差一个位移）
  const noteRows = layout.notes || [];
  const noteCards = noteRows.map(x => `<div class="cnote" style="left:${Number(x.x)||0}px;top:${Number(x.y)||0}px">${esc(String(x.text||""))}</div>`).join("");
  const W = Math.max(360, ...pos.map(p2 => p2.x + GEO.nodeW + 26), ...labelPos.map(r => r.x + r.w/2 + GEO.labelPad),
    ...noteRows.map(n => (Number(n.x)||0) + GEO.noteW + 20),
    ...skillPos.map(s => s.x + SK_W + 20));
  const H = Math.max(230, ...pos.map(p2 => p2.y + GEO.nodeH + 46), ...labelPos.map(r => r.y + r.h/2 + GEO.labelPad),
    ...noteRows.map(n => (Number(n.y)||0) + 90),
    ...skillPos.map(s => s.y + SK_H + 20));
  const cards = pos.map(p => graphCard(nodeOf(p.id), p.x, p.y)).join("")
    + skillPos.map(s => skillCardHtml(s, "skcard in-graph")).join("");
  return `<div class="gbox" data-gkey="${esc(key || "")}">
    <div class="gwrap"><div class="ginner" style="width:${W}px;height:${H}px">
      <svg class="gsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lines.join("")}</svg>
      ${cards}${labels.join("")}${noteCards}
    </div></div>
    ${zoomBarHtml()}
  </div>`;
}
function renderSystems(){

/* 缩放按钮：详情页每个体系图各一套，状态按体系 key 记在本机 */
$("systemsView").addEventListener("click", e => {
  const btn = e.target.closest(".gzoom [data-z]");

});
function roleRows(owner){
  return (roleAdds[String(owner)] || []).filter(x => !x.hidden);
}
function roleActiveIds(owner, groups){
  const own = String(owner);
  const hidden = new Set((roleAdds[own] || []).filter(x => x.hidden).map(x => String(x.id)));
  const ids = [];
  (groups || DATA.roles || []).forEach(g => {
    if(!(g.members||[]).map(String).includes(own)) return;
    (g.members||[]).forEach(id => {
      const k = String(id);
      if(!hidden.has(k) && !ids.includes(k)) ids.push(k);
    });
  });
  roleRows(own).forEach(a => {
    const k = String(a.id);
    if(!ids.includes(k)) ids.push(k);
  });
  return ids;
}
function roleNoteOf(id, note){
  if(note) return String(note);
  const e = effective(String(id));
  if(e && e.note) return String(e.note);
  if(e && e.editor_note) return String(e.editor_note);
  for(const g of (DATA.roles||[])){
    for(const line of (g.differences||[])){
      const t = String(line).trim();
      if(t.indexOf(String(id) + " ") === 0){
        const i = t.indexOf("：");
        return i >= 0 ? t.slice(i + 1).trim() : t;
      }
    }
  }
  return "";
}

function roleTagsOf(n){

function splitRoleTags(tags){

}

      const cur = Array.isArray(val) ? val.join("\n") : String(val||"");

  }).join("");
  const own = systemsContaining(state.sel);
  box.insertAdjacentHTML("beforeend", `<div class="frow"><label class="fl">所属体系</label>
    <div class="readonly">${own.length ? own.map(x => `<span class="chip b">${esc(x.name)}</span>`).join("")
      : `<span class="empty" style="padding:2px">—</span>`}</div></div>`);

function closeEditor(){ $("editModal").classList.remove("on"); }
function collectEditor(){
  const n = effective(state.sel) || {};
  const out = {};
  const split = readRoleChips();
  FIELDS.forEach(spec => {
    const key = spec.key;
    // 定位在界面上是一组，落库要拆回 roles / classes 两个字段（classes 是隐藏字段）
    if(key === "roles" || key === "classes"){
      out[key] = split ? split[key] : (n[key] !== undefined ? n[key] : []);
      return;
    }
    if(!EDIT_FIELD_SET.has(key)){ out[key] = n[key] !== undefined ? n[key] : (spec.type==="multi_enum"||spec.type==="lines"?[]:""); return; }
    if(spec.type === "multi_enum" || spec.uitype === "skills"){
      out[key] = Array.from(document.querySelectorAll(`#fields .chipeditor[data-key="${key}"] .echip`)).map(x=>x.getAttribute("data-v"));
    }else{
      const el = document.querySelector(`#fields [data-f="${key}"]`);
      const raw = el ? el.value : "";
      out[key] = (spec.type === "lines") ? String(raw).split("\n").map(x=>x.trim()).filter(Boolean) : String(raw).trim();
    }
  });
  delete out.system_keys;      // 所属体系只读派生，不把手工勾选结果写回补丁
  return out;
}
function saveEditor(){
  const n = nodeOf(state.sel); if(!n) return;
  const v = collectEditor();
  const spec = FIELDS.find(f => f.key === "roles") || {};
  const lim = SCHEMA.limits || {};
  const maxAll = spec.max != null ? spec.max : (lim.role_max || 3);
  const maxOwn = spec.custom_max != null ? spec.custom_max : (lim.role_custom_max || 2);
  const ownLen = spec.custom_len != null ? spec.custom_len : (lim.role_custom_len || 20);
  const maxCls = roleLimit("class_max", 3);
  const total = roleTagsOf({classes: v.classes, roles: v.roles}).length;
  if(total > maxAll){ $("editErr").textContent = "定位最多 " + maxAll + " 个"; return; }
  if((v.classes || []).length > maxCls){ $("editErr").textContent = "定位分类最多 " + maxCls + " 个"; return; }
  if((v.roles || []).length > maxOwn){ $("editErr").textContent = "特色最多 " + maxOwn + " 条"; return; }
  const tooLong = (v.roles || []).find(x => String(x).length > ownLen);
  if(tooLong){ $("editErr").textContent = "特色「" + tooLong + "」超过 " + ownLen + " 字"; return; }
  edits[state.sel] = v;
  saveEdits(); renderAll(); closeEditor();
}

function layout(i){ return {x:20+(i%3)*132, y:20+Math.floor(i/3)*128}; }
/* ---------- 技能卡：体系画布里的「技能节点」 ----------
   画布上只有两种节点：精灵卡（graph.nodes，id 为数字）与技能卡（graph.skills，key 为 s:精灵:sid）。
   连线（graph.edges）两端既可以是数字也可以是技能 key，其余逻辑一律按字符串比较。 */
const SKILL_KEY_RE = /^s:/;
const isSkillKey = k => SKILL_KEY_RE.test(String(k));
const skillKeyOf = (pet, row) => "s:" + pet + ":" + (row && row.id ? row.id : "n" + String((row && row.n) || ""));
function skillByKey(k){ return (graph.skills || []).find(x => String(x.key) === String(k)) || null; }
/* 备注文本（备注文本）：id 形如 n<base36>，只在 graph.notes 里存在。
   2026-11-17 用户口径：备注文本也能像精灵卡一样当连线端点。 */
function noteByKey(k){ return (graph.notes || []).find(x => String(x.id) === String(k)) || null; }
const isNoteKey = k => !!noteByKey(k);
function objByKey(k){
  const pet = graph.nodes.find(x => String(x.id) === String(k));

}
/* 按 id（或退回名称）从当前精灵的技能表里取出技能数据，保证渲染的是最新资料 */
function resolveSkill(sk){
  const n = nodeOf(String(sk.pet)); if(!n) return null;
  const rows = skillsOf(n);
  if(sk.sid) {
    const hit = rows.find(r => Number(r.id) === Number(sk.sid));
    if(hit) return hit;
  }
  return rows.find(r => String(r.n) === String(sk.name)) || null;
}
function skillCardHtml(sk, cls){

function center(nd){ return {x:nd.x + GEO.editCx, y:nd.y + GEO.editCy}; }
/* 连线端点：精灵卡用固定尺寸，技能卡用实测尺寸 */
function edgeEnd(k){
  const pet = graph.nodes.find(x => String(x.id) === String(k));
  if(pet){
    const n = nodeOf(String(pet.id));
    return {x: pet.x + GEO.editCx, y: pet.y + GEO.editCy, w: GEO.editW, h: GEO.editH,
      name: n ? n.name : ("#" + pet.id)};
  }
  const sk = skillByKey(k);
  if(sk){
    const row = resolveSkill(sk) || {};
    const w = sk.w || GEO.skW, h = sk.h || GEO.skH;
    return {x: (Number(sk.x) || 0) + w/2, y: (Number(sk.y) || 0) + h/2, w, h,
      name: row.n || sk.name || "技能"};
  }
  const note = noteByKey(k);
  if(note){
    const w = note.w || GEO.noteW, h = note.h || GEO.noteH;
    return {x: (Number(note.x) || 0) + w/2, y: (Number(note.y) || 0) + h/2, w, h,
      name: "备注文本：" + short(note.text || "（空）", 12)};
  }
  return null;
}
/* 连线颜色：默认跟随主题（--edge），用户可逐条覆盖。
   颜色存 canvas.edge_colors，键为两端 key 排序拼接，精灵/技能卡/备注文本三类边共用；
   没设过颜色的边不写字段，历史数据渲染结果与改动前完全一致。 */
const cssVar = name => (getComputedStyle(document.documentElement).getPropertyValue(name) || "").trim();
const EDGE_ACCENT = cssVar("--edge-own") || "#f59e0b";        // 与 CSS --edge-own 同源
const EDGE_HOVER_LIGHTEN = 0.34;                              // 悬停提亮比例（0–1）
const EDGE_PALETTE = [
  ["", "默认（跟随主题）"], ["#ef4444", "红"], ["#f97316", "橙"], [EDGE_ACCENT, "琥珀"],
  ["#eab308", "黄"], ["#22c55e", "绿"], ["#14b8a6", "青"], ["#3b82f6", "蓝"],
  ["#8b5cf6", "紫"], ["#64748b", "灰"]
];
function edgeKeyOf(a, b){ return [String(a), String(b)].sort().join("|"); }
function normColor(v){
  const s = String(v || "").trim();
  return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toLowerCase() : "";
}
function lightenHex(hex, p){
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || ""));
  if(!m) return hex;
  const f = v => Math.round(parseInt(v,16) + (255 - parseInt(v,16)) * p).toString(16).padStart(2,"0");
  return "#" + f(m[1]) + f(m[2]) + f(m[3]);
}
function edgeColorOf(e){ return normColor(e && e.color); }
/* 连线的内联样式：笔型（宽/虚线）取自 LINK_PEN，颜色覆盖走 --ec。
   两处共用同一个函数，随画布一起缩放——不按缩放反补偿，避免「卡片缩小、线不变粗」的割裂感。 */
function edgeStyleAttr(color, penKind){
  const dec = [];
  if(penKind) dec.push(penStyle(penKind));
  const c = normColor(color);
  if(c) dec.push(`--ec:${c};--ec-h:${lightenHex(c, EDGE_HOVER_LIGHTEN)}`);
  return dec.length ? ` style="${dec.join(";")}"` : "";
}
/* 连线笔型（唯一来源）：线宽与虚线只写在这里。
   CSS 只管颜色/透明度；实际数值由 penValues() 写成内联样式，并按画布缩放反补偿，
   这样编辑画布（scale 缩放）与详情图鉴（zoom 缩放）在任何缩放比例下都是同一根线。 */
const LINK_PEN = {
  pet:   {w:2,   d:""},
  skill: {w:1.5, d:"5 3"},
  note:  {w:1.4, d:"2 4"},
  lead:  {w:1,   d:"3 3"},
  temp:  {w:2,   d:"5 4"}
};
function penStyle(kind){
  const p = LINK_PEN[kind] || LINK_PEN.pet;
  return `stroke-width:${p.w}px` + (p.d ? `;stroke-dasharray:${p.d}` : "");
}
/* 连线几何（两处共用的唯一实现）：端点取「卡片中心向对方引的射线与卡片边框」的交点，
   再各留 EDGE_GAP，线正好贴到卡片边上。
   旧写法用固定内缩 min(56, 长度×0.32)：短连线和小备注文本会离出一大截空白，看起来像断线。 */
function boxExit(cx, cy, w, h, ux, uy){
  const hw = (Number(w) || 0) / 2, hh = (Number(h) || 0) / 2;
  if(!hw || !hh) return {x: cx, y: cy};
  const tx = Math.abs(ux) > 1e-6 ? hw / Math.abs(ux) : Infinity;
  const ty = Math.abs(uy) > 1e-6 ? hh / Math.abs(uy) : Infinity;
  const t = Math.min(tx, ty);
  return {x: cx + ux * t, y: cy + uy * t};
}
function edgeSegment(a, b){
  const dlen = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const ux = (b.x - a.x) / dlen, uy = (b.y - a.y) / dlen;
  const p1 = boxExit(a.x, a.y, a.w, a.h, ux, uy);
  const p2 = boxExit(b.x, b.y, b.w, b.h, -ux, -uy);
  const gap = Math.min(GEO.edgeGap || 5, dlen * 0.15);   // 线段极短时不至于把线吃掉
  return {sx: p1.x + ux * gap, sy: p1.y + uy * gap,
          ex: p2.x - ux * gap, ey: p2.y - uy * gap,
          mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2};
}

/* 连线的渲染模型（唯一实现）：解析两端 → 判定笔型／归属 → 算线段。
   编辑器与图鉴都从这里取数据，只有「端点解析」和「DOM 怎么拼」不同，
   避免两处各算一套 own/kind/端点而慢慢漂移。
   endsOf(key) 由调用方注入；skillPetOf 缺省用本地画布的 graph.skills。 */
function edgeModels(edges, endsOf, skillPetOf){
  const petOf = skillPetOf || (k => { const s = skillByKey(k); return s ? s.pet : null; });
  const out = [];
  (edges || []).forEach((e, i) => {
    const a = endsOf(e.a), b = endsOf(e.b);
    if(!a || !b) return;
    const isSk = isSkillKey(e.a) || isSkillKey(e.b);
    const isNt = isNoteKey(e.a) || isNoteKey(e.b);
    const own = isSk && (String(petOf(e.a) ?? "") === String(e.b) ||
                         String(petOf(e.b) ?? "") === String(e.a));
    out.push({i, e, a, b, own,
      kind: isSk ? "skill" : (isNt ? "note" : "pet"),
      seg: edgeSegment(a, b)});
  });
  return out;
}
function drawEdges(){
  const svg = $("sysLinks"), canvas = $("sysCanvas");
  const parts = [], labelItems = [];
  edgeModels(graph.edges, edgeEnd).forEach(m => {
    const {i, e, a, b, own, kind, seg} = m;
    // 精灵与「它自己的」技能卡之间用黄线，便于一眼区分技能归属
    const cls = "clink" + (kind === "skill" ? " sk" : "") + (kind === "note" ? " nt" : "")
      + (own ? " own" : "");
    const pen = kind;
    parts.push(`<line class="chit" data-i="${i}" x1="${seg.sx}" y1="${seg.sy}" x2="${seg.ex}" y2="${seg.ey}"></line>`);
    parts.push(`<line class="${cls}" data-i="${i}"${edgeStyleAttr(edgeColorOf(e), pen)} x1="${seg.sx}" y1="${seg.sy}" x2="${seg.ex}" y2="${seg.ey}"></line>`);
    const note = String(e.note || "").trim();
    if(note){
      labelItems.push({i, x: seg.mx, y: seg.my - 12, text: note,
        label: a.name + " → " + b.name});
    }
  });
  const linkedNoteIds = new Set();
  graph.edges.forEach(e => {
    if(isNoteKey(e.a)) linkedNoteIds.add(String(e.a));
    if(isNoteKey(e.b)) linkedNoteIds.add(String(e.b));
  });
  const rects = graph.nodes.map(n => ({x:n.x, y:n.y, w:GEO.editW, h:GEO.editH}))
    .concat((graph.skills||[]).map(s => ({x:Number(s.x)||0, y:Number(s.y)||0, w:s.w||GEO.skW, h:s.h||GEO.skH})))
    .concat((graph.notes||[]).filter(n => linkedNoteIds.has(String(n.id)))
      .map(n => ({x:Number(n.x)||0, y:Number(n.y)||0, w:n.w||GEO.noteW, h:n.h||GEO.noteH})));
  const labelPos = layoutEdgeLabels(labelItems, rects);
  labelItems.forEach((it, k) => {
    const r = labelPos[k];
    if(!r.lead || r.side) return;
    parts.push(`<line class="glead"${edgeStyleAttr("", "lead")} x1="${it.x}" y1="${it.y + 4}" x2="${r.x}" y2="${r.y}"></line>`);
  });
  const labels = labelItems.map((it,k) => {
    const r = labelPos[k];
    const head = r.side && it.label ? `<div class="gl-head">${esc(it.label)}</div>` : "";
    return `<div class="clabel" data-i="${it.i}" style="left:${r.x}px;top:${r.y}px">${head}${esc(it.text)}</div>`;
  });
  const needH = Math.max(430, ...graph.nodes.map(n => (Number(n.y)||0) + GEO.editH + 24),
    ...(graph.skills||[]).map(s => (Number(s.y)||0) + (s.h||GEO.skH) + 24),
    ...labelPos.map(r => r.y + r.h/2 + 20), ...(graph.notes||[]).map(n => (Number(n.y)||0) + 80));
  // 舞台按内容撑开（宽高都算），画布本身尺寸固定：内容超出就内部滚动 + 用缩放看全
  const needW = Math.max(canvas.clientWidth || 800,
    ...graph.nodes.map(n => (Number(n.x)||0) + GEO.editW + 12),
    ...(graph.skills||[]).map(s => (Number(s.x)||0) + (s.w||GEO.skW) + 12),
    ...labelPos.map(r => r.x + r.w/2 + 14),
    ...(graph.notes||[]).map(n => (Number(n.x)||0) + GEO.noteW + 16));
  const stage = $("sysStage");
  if(stage){
    stage.style.height = needH + "px";
    stage.style.width = needW + "px";
  }
  canvas.style.minHeight = needH + "px";
  // viewBox 必须和舞台「实际布局尺寸」逐像素对齐：
  // 以前用 Math.max(needH, stage.offsetHeight)，旧高度偏大时浏览器会按 preserveAspectRatio
  // 把整层等比缩小并水平居中——线条整体右移 + 缩短，永远贴不到卡片（2026-11-17 修）。
  // 用 SVG 的 width/height 属性（不是 CSS）锁成内容尺寸，viewBox 同值 → 1:1 不做任何缩放。
  // 卡片按同一套坐标绝对定位，线端因此永远贴着卡片边框。
  svg.setAttribute("width", needW);
  svg.setAttribute("height", needH);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("viewBox", `0 0 ${needW} ${needH}`);
  if(linkFrom && pointer){
    const a = edgeEnd(linkFrom);
    if(a) parts.push(`<line class="clink tmp"${edgeStyleAttr("", "temp")} x1="${a.x}" y1="${a.y}" x2="${pointer.x}" y2="${pointer.y}"></line>`);
  }
  svg.innerHTML = parts.join("");
  $("sysEdgeLabels").innerHTML = labels.join("");
  const bindEdgeMenu = el => el.addEventListener("contextmenu", ev => {
    ev.preventDefault(); ev.stopPropagation();
    openEdgeMenu(Number(el.getAttribute("data-i")), ev.clientX, ev.clientY);
  });
  svg.querySelectorAll("[data-i]").forEach(bindEdgeMenu);

function canvasBoxes(){
  const out = [];
  (graph.nodes || []).forEach(n => out.push({x:Number(n.x)||0, y:Number(n.y)||0, w:GEO.editW, h:GEO.editH}));
  (graph.skills || []).forEach(s => out.push({x:Number(s.x)||0, y:Number(s.y)||0,

const BOX_PAD = 10;
function boxFree(x, y, w, h, boxes){
  return !boxes.some(b => x < b.x + b.w + BOX_PAD && x + w + BOX_PAD > b.x &&
                          y < b.y + b.h + BOX_PAD && y + h + BOX_PAD > b.y);

function addSkillToCanvas(petId, row, at){
  const key = skillKeyOf(petId, row);
  if(!row) return;
  if(skillByKey(key)){ toast("这张技能卡已经在画布上了"); return; }
  const pet = graph.nodes.find(x => String(x.id) === String(petId));
  const canvas = $("sysCanvas");
  const w = GEO.skW, cw = canvas ? canvas.clientWidth : 800, ch = canvas ? canvas.clientHeight : 600;
  if(at && Number.isFinite(at.x) && Number.isFinite(at.y)){
    // 长按拖进来的位置：以光标为卡片中心，只做画布内夹取
    graph.skills.push({key, pet: Number(petId), sid: Number(row.id) || 0, name: String(row.n || ""),
      x: clamp(at.x, 4, Math.max(4, cw - w - 8)),
      y: clamp(at.y, 4, Math.max(4, ch - GEO.skH - 14))});
    addEdge(petId, key);
    drawGraph();
    muteTipFor(key);
    popSkillCard(key);
    toast("已添加技能卡：" + (row.n || key));
    return;
  }
  // 依次试「已有技能卡下方 → 右侧 → 下方 → 左侧 → 上方」，取第一处不压住任何卡的位置；
  // 全部被占才退回右侧（此时靠 z-index 保证精灵卡仍在上层，不会被技能卡盖住）。
  const mine = (graph.skills||[]).filter(s => String(s.pet) === String(petId));
  const boxes = canvasBoxes();
  const clampX = v => clamp(v, 8, Math.max(8, cw - w - 8));
  const clampY = v => clamp(v, 8, Math.max(8, ch - GEO.skH - 14));
  const bottom = mine.reduce((m, s) => Math.max(m, (Number(s.y)||0) + (s.h||GEO.skH)),
    pet ? pet.y : 40);
  const cands = [];
  if(pet){
    if(mine.length) cands.push([pet.x + GEO.editW + 16, bottom + 12]);
    cands.push([pet.x + GEO.editW + 16, pet.y]);        // 右侧
    cands.push([pet.x, pet.y + GEO.editH + 16]);        // 下方
    cands.push([pet.x - w - 16, pet.y]);                // 左侧
    cands.push([pet.x, pet.y - GEO.skH - 16]);          // 上方
  } else {
    cands.push([40, 40], [40, 40 + GEO.skH + 16]);

  let x = clampX(cands[0][0]), y = clampY(cands[0][1]);
  for(const [cx0, cy0] of cands){
    const px = clampX(cx0), py = clampY(cy0);
    if(boxFree(px, py, w, GEO.skH, boxes)){ x = px; y = py; break; }
  }
  graph.skills.push({key, pet: Number(petId), sid: Number(row.id) || 0,
    name: String(row.n || ""), x, y});
  addEdge(petId, key);                       // 默认与所属精灵连线
  drawGraph();
  muteTipFor(key);                           // 添加完不要自己弹效果卡
  popSkillCard(key);
  toast("已添加技能卡：" + (row.n || key));
}

  const linkNotes = {};

}
function edgeNotesValid(){
  // 2026-11-09：备注不设下限，只保留上限保护。
  for(const e of graph.edges){
    if(String(e.note||"").trim().length > EDGE_NOTE_MAX) return false;
  }
  return true;
}
function syncEdgesFor(key, name, payload){
  const pairs = payload.chain_edges || [];
  const pairsInUse = curEdges().filter(e => String(e.system_key) !== String(key))
    .map(e => [String(e.a), String(e.b)].sort().join("-"));
  for(const p of pairs){
    if(pairsInUse.includes([String(p[0]), String(p[1])].sort().join("-"))){
      throw new Error("同一对精灵在其它体系已有联动边：" + p[0] + "-" + p[1]);
    }
  }
  const meta = payload.edge_meta || {};
  edgeState = curEdges().filter(e => String(e.system_key) !== String(key)).concat(pairs.map(p => {
    const m = meta[p[0]+"-"+p[1]] || {};
    return {system_key:key, system_name:name, a:Number(p[0]), b:Number(p[1]),
      type:m.type || Object.keys(EDGE_TYPES)[0] || "resource", note:m.note || "",
      chain_status:(sysData()||{}).chain_status || ""};
  }));
  saveEdges();
}
function saveSystem(){
  const data = sysValues();
  if(!data.core.length){ sysErr("画布还没有精灵：从左侧拖一只进来"); return; }
  if(!edgeNotesValid()){ sysErr("连线备注最多 "+EDGE_NOTE_MAX+" 字（右键线可改）"); return; }

  if(sysEditing){
    const item = sysData(); if(!item) return;
    const key = String(item.key);
    const local = (systemState.create||[]).find(x => String(x.key) === key);
    try{ syncEdgesFor(key, item.name, data); }
    catch(e){ sysErr(e.message); return; }
    const patch = Object.assign({}, data, {key:key});
    delete patch.name; delete patch.kind;      // 名称／类型／章节不可改（类型 UI 已移除）
    if(String(patch.section_note||"") === String(item.body||"")) delete patch.section_note;
    if(local){
      Object.assign(local, patch, {section: local.section || key + "：" + (patch.carrier || "前端图形化新建")});
    }else{
      systemState.overwrite = (systemState.overwrite||[]).filter(x => String(x.key) !== key).concat([patch]);
      delete (systemState.edits||{})[key];
    }
    saveSystems(); applySystemState(); closeSystemManager(); renderAll();
    toast("已保存「" + item.name + "」：" + data.core.length + " 只精灵 / " +
      data.chain_edges.length + " 条连线（本机暂存）");
    return;
  }

  if(!data.name){ sysErr("先填一个名称即可（不必以「体系」结尾，字数不限）"); return; }
  if((DATA.systems||[]).some(s=>String(s.key)===data.name)){ sysErr("已有同名体系：" + data.name); return; }
  try{ syncEdgesFor(data.name, data.name, data); }
  catch(e){ sysErr(e.message); return; }
  const item = Object.assign({}, data, {
    key: data.name,
    section: data.name + "：" + (data.carrier || "前端图形化新建，正文待补"),
    alternatives:{}, warning_edges:[], external:[],
    evidence_grade: (SYS_CFG.defaults||{}).evidence_grade || "机制推演／待核",
    chain_status: (SYS_CFG.defaults||{}).chain_status || "顺序链待核（证据不足）",
    origin:"view_edit", created_at: new Date().toISOString().slice(0,10),
  });
  systemState.create = (systemState.create||[]).filter(x=>String(x.key)!==String(item.key)).concat([item]);
  saveSystems();
  applySystemState(); closeSystemManager(); renderAll();
  toast("已创建「" + item.name + "」：" + data.core.length + " 只精灵 / " +
    data.chain_edges.length + " 条连线，导出补丁后落库");
}
function deleteSystem(){
  const item = sysData(); if(!item) return;
  if(!confirm("删除体系「" + item.name + "」？导出补丁并落库后会同时移除 tactics.md 章节与 SKILL 速查行；--clear 可恢复。")) return;
  const key = String(item.key);
  const idx = (systemState.create||[]).findIndex(x => String(x.key) === key);
  if(idx >= 0) systemState.create.splice(idx, 1);
  else systemState.delete = [...new Set([...(systemState.delete||[]), key])];
  systemState.overwrite = (systemState.overwrite||[]).filter(x => String(x.key) !== key);
  delete (systemState.edits||{})[key];
  edgeState = curEdges().filter(e => String(e.system_key) !== key);
  saveEdges(); saveSystems(); applySystemState(); closeSystemManager(); renderAll();
  toast("已删除「" + item.name + "」（本机暂存）；导出补丁后落库");
}

/* ---------- 图像：拉取时一并下载，缓存在 IndexedDB（file:// 也可用） ---------- */
const IMG_DB = "seer_peak_img_v1", IMG_STORE = "img";
let imgDB = null;
function imgDBOpen(){
  return new Promise(res => {
    if(!window.indexedDB) return res(null);
    let req = null;
    try{ req = indexedDB.open(IMG_DB, 1); }catch(e){ return res(null); }
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => res(null);
  });
}
function imgCachePut(key, blob){
  return new Promise(async res => {
    if(!imgDB) imgDB = await imgDBOpen();
    if(!imgDB) return res(false);
    try{
      const t = imgDB.transaction(IMG_STORE, "readwrite");
      t.objectStore(IMG_STORE).put(blob, key);
      t.oncomplete = () => {
        const old = IMG_URLS.get(key);
        if(old){ try{ URL.revokeObjectURL(old); }catch(e){} }
        IMG_URLS.set(key, URL.createObjectURL(blob));
        res(true);
      };
      t.onerror = () => res(false);
    }catch(e){ res(false); }
  });
}
async function imgCacheLoad(){
  imgDB = await imgDBOpen();
  if(!imgDB) return;
  const keys = await new Promise(res => {
    try{
      const t = imgDB.transaction(IMG_STORE, "readonly");
      const q = t.objectStore(IMG_STORE).getAllKeys();
      q.onsuccess = () => res(q.result || []); q.onerror = () => res([]);
    }catch(e){ res([]); }
  });
  if(!keys.length) return;
  for(const k of keys){
    const blob = await new Promise(res => {
      try{
        const t = imgDB.transaction(IMG_STORE, "readonly");
        const q = t.objectStore(IMG_STORE).get(k);
        q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    if(blob) IMG_URLS.set(String(k), URL.createObjectURL(blob));
  }
  renderAll();
}
function shrinkImage(blob, max, q){
  return new Promise(res => {
    if(!window.createImageBitmap) return res(null);
    createImageBitmap(blob).then(bmp => {
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(bmp, 0, 0, w, h);
      c.toBlob(b => res(b), "image/webp", q);
    }).catch(() => res(null));
  });
}
function pullPetImage(kind, id){
  return (async () => {
    const key = kind + ":" + Number(id);
    if(IMG_URLS.has(key)) return true;
    // H5 不带 CORS 头，浏览器 fetch 会被拦；只走带 CORS 的镜像。
    const urls = petImgChain(kind, id).filter(u => !u.includes("seerh5.61.com"));
    for(const u of urls){
      try{
        const r = await fetch(u, {mode: "cors"});
        if(!r.ok) continue;
        const blob = await r.blob();
        if(!blob || !blob.size) continue;
        const small = await shrinkImage(blob, kind === "head" ? 200 : 340, kind === "head" ? 0.8 : 0.78);
        await imgCachePut(key, small || blob);
        if(String(state.sel) === String(id)) renderHero();
        return true;
      }catch(e){}
    }
    return false;
  })();
}

async function pullImages(ids, btn, label){
  const need = [...new Set(ids.map(Number).filter(Number.isFinite))].filter(id => !hasLocalImage(id));
  if(!need.length) return 0;
  let done = 0, ok = 0;
  const queue = need.slice();
  const worker = async () => {
    while(queue.length){
      const id = queue.shift();
      done++;
      pullBtn(btn, `${label} ${done}/${need.length}`, true);
      const a = await pullPetImage("head", id);
      const b = await pullPetImage("body", id);
      if(a || b) ok++;
    }
  };
  await Promise.all(Array.from({length: Math.min(4, need.length)}, worker));
  if($("libModal").classList.contains("on")) renderLibraryResults();
  return ok;
}
async function apiJSON(url, tries = 2){
  let last;
  for(let i = 0; i <= tries; i++){
    try{
      const r = await fetch(url, {headers: {"Accept": "application/json"}});
      if(!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){ last = e; await sleep(320 * (i + 1)); }
  }
  throw last;
}
/* 兼容三种格式：整包数组 / 分页 {results,next,count} / 单对象 */
async function seerPages(path, onProgress){
  let url = path.startsWith("http") ? path : SEER_API + "/" + path;
  const out = [];
  let guard = 0;
  while(url && guard++ < 400){
    const d = await apiJSON(url);
    if(Array.isArray(d)){ out.push(...d); break; }
    const rows = d.results || d.data || d.items;
    if(!Array.isArray(rows)){
      if(d && d.id != null) out.push(d);
      break;
    }
    out.push(...rows);
    onProgress && onProgress(out.length, Number(d.count) || out.length, guard);
    url = d.next || null;
    if(url) await sleep(90);
  }
  return out;
}
function cleanRemote(text){
  return String(text || "")
    .replace(/\[sprite[^\]]*\]/g, "")
    .replace(/\[color=[^\]]*\]|\[\/color\]/g, "")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/[{}]/g, "")
    .replace(/\|/g, "\n")
    .replace(/\u3000/g, " ")
    .trim();
}
function effectList(raw){
  if(Array.isArray(raw)) return raw;
  return raw && typeof raw === "object" ? [raw] : [];
}
function normalizeSkill(sk, ref){
  const eff = [];
  effectList(sk.skill_effect).forEach(x => x && x.info && eff.push(cleanRemote(x.info)));
  effectList(sk.hide_effect).forEach(x => x && x.info && eff.push(cleanRemote(x.info)));
  return {
    n: String(sk.name || ""), p: sk.power, pp: sk.max_pp, pr: sk.priority,
    cat: TYPE_CAT.get(Number(sk.category && sk.category.id)) || "",
    t: TYPE_MAP.get(Number(sk.type && sk.type.id)) || "",
    e: eff.join("；").slice(0, 300), d: cleanRemote(sk.info).slice(0, 120),
    f: Number(!!(ref && ref.is_fifth)), a: Number(!!(ref && ref.is_advanced)),
    sp: Number(!!(ref && ref.is_special)), lv: ref && ref.learning_level,
  };
}
async function loadPullMeta(btn){

function petRow(pet){

  const refs = Array.isArray(pet.soulmark) ? pet.soulmark : (pet.soulmark ? [pet.soulmark] : []);

function mergePulled(rows){
  let added = 0;
  rows.forEach(r => {
    if(!r || !Number.isFinite(Number(r.id)) || !r.name) return;
    const id = Number(r.id), old = LIB_MAP.get(id);
    if(old){
      const skills = (old.skills && old.skills.length) ? old.skills : (r.skills || []);
      const localAv = !!(old.avatar && old.avatar.includes("/assets/seerapi/"));
      const localPo = !!(old.portrait && old.portrait.includes("/assets/seerapi/"));
      const patch = {};
      Object.entries(r).forEach(([k, v]) => {
        if(v !== "" && v !== "—" && v != null) patch[k] = v;
      });
      // 本地图（随包发布的 1977 只）比 H5 远程图稳定，拉取时不要被换回远程地址。
      if(localAv) delete patch.avatar;
      if(localPo) delete patch.portrait;
      patch.skills = skills;
      Object.assign(old, patch);
    }else{
      LIBRARY.push(r); LIB_MAP.set(id, r); added++;
    }
  });
  return added;
}
function persistPulled(rows){
  rows.forEach(r => { if(r && Number.isFinite(Number(r.id))) pullCache[r.id] = r; });
  try{
    localStorage.setItem(PULL_KEY, JSON.stringify(pullCache));
    return;
  }catch(e){ /* 配额不足：全量只缓存 HTML 库里没有的新行 */ }
  const slim = {};
  Object.entries(pullCache).forEach(([k, v]) => { if(!PULL_BASE_IDS.has(Number(k))) slim[k] = v; });
  pullCache = slim;
  try{ localStorage.setItem(PULL_KEY, JSON.stringify(slim)); }catch(e){}
}

/* 全量只拉名单+魂印；真正添加某只时再按需补它的技能，避免一次拉 2.7 万条技能。 */
async function hydrateSkills(id){
  const row = LIB_MAP.get(Number(id));
  if(!row || (row.skills && row.skills.length)) return;
  try{
    await loadPullMeta();
    const pet = await apiJSON(`${SEER_API}/pet/${id}`);
    const items = (pet.skill || []).map(ref => ({ref, sid: ref && ref.skill && ref.skill.id}))
      .filter(x => x.sid);
    const skills = [];
    // 4 路并发，23 个技能约 5 秒；失败的单条跳过，不影响整只。
    for(let i = 0; i < items.length; i += 4){
      const batch = items.slice(i, i + 4);
      const rows = await Promise.all(batch.map(x =>
        apiJSON(`${SEER_API}/skill/${x.sid}`).catch(() => null)));
      rows.forEach((sk, j) => { if(sk) skills.push(normalizeSkill(sk, batch[j].ref)); });
      await sleep(60);
    }
    if(skills.length){
      row.skills = skills;
      persistPulled([row]);
      if(String(state.sel) === String(id)) renderHero();
      if($("libModal").classList.contains("on")) renderLibraryResults();
    }
  }catch(e){ /* 离线时保持空技能表，不打断添加 */ }
}

/* 「＋特色」：新增一条可编辑的自定义定位；上限与长度都读 schema，不写死 */
function roleSpec(){ return ROLE_FIELD; }
function roleLimit(name, dflt){
  const hit = ROLE_LIMIT_KEYS[name];
  if(!hit) return dflt;
  const spec = roleSpec(), lim = SCHEMA.limits || {};
  if(typeof spec[hit[0]] === "number") return spec[hit[0]];
  if(typeof lim[hit[1]] === "number") return lim[hit[1]];
  return dflt != null ? dflt : hit[2];
}
function addOwnChip(btn){
  const box = btn.closest(".chipeditor");
  const chips = box.querySelectorAll(".echip"), inputs = box.querySelectorAll(".owninput");
  const maxAll = roleLimit("max", 3), maxOwn = roleLimit("custom_max", 2);
  if(chips.length + inputs.length >= maxAll){
    $("editErr").textContent = "定位最多 " + maxAll + " 个"; return;
  }
  if(box.querySelectorAll(".echip.own").length + inputs.length >= maxOwn){
    $("editErr").textContent = "特色最多 " + maxOwn + " 条"; return;
  }
  const inp = document.createElement("input");
  inp.className = "owninput";
  inp.maxLength = roleLimit("custom_len", 20);
  inp.placeholder = "输入定位，如 主力";
  inp.addEventListener("keydown", ev => {
    if(ev.key === "Enter"){ ev.preventDefault(); commitOwnChip(inp); }
    else if(ev.key === "Escape"){ inp.remove(); }
  });
  inp.addEventListener("blur", () => commitOwnChip(inp));

function makeOwnChip(text){
  const chip = document.createElement("span");
  chip.className = "echip own"; chip.dataset.v = text; chip.title = "点文字可修改";
  chip.innerHTML = esc(text) + "<b>×</b>";

}
function commitOwnChip(inp, restore){
  if(!inp.isConnected) return;                 // Enter 已提交过，blur 会再来一次
  let v = String(inp.value || "").trim();
  if(!v){
    // 编辑既有标签时清空＝取消编辑，还原原值；新增时才真正丢弃
    if(restore) inp.replaceWith(makeOwnChip(restore)); else inp.remove();
    return;
  }
  const maxLen = roleLimit("custom_len", 20);
  if(v.length > maxLen){
    v = v.slice(0, maxLen);
    $("editErr").textContent = "特色超过 " + maxLen + " 字，已截断";
  }else{
    $("editErr").textContent = "";
  }
  inp.replaceWith(makeOwnChip(v));
}
function editOwnChip(chip){
  const old = chip.getAttribute("data-v") || "";
  const inp = document.createElement("input");
  inp.className = "owninput";
  inp.maxLength = roleLimit("custom_len", 20);
  inp.value = old;
  inp.addEventListener("keydown", ev => {
    if(ev.key === "Enter"){ ev.preventDefault(); commitOwnChip(inp, old); }
    else if(ev.key === "Escape"){ inp.replaceWith(makeOwnChip(old)); }
  });
  inp.addEventListener("blur", () => commitOwnChip(inp, old));
  chip.replaceWith(inp);
  inp.focus(); inp.select();
}
function removeChip(chip){
  const box = chip.closest(".chipeditor");
  const v = chip.getAttribute("data-v");
  const opt = Array.from(box.querySelectorAll(".chipopt")).find(b=>b.getAttribute("data-v")===v);
  chip.remove(); if(opt) opt.disabled = false;
  if(box && box.classList.contains("roles")){
    // 删掉分类标签后，把菜单里对应项解禁（定位组共用一份分类词表）
    const all = Array.from(box.querySelectorAll(".echip")).map(x => x.getAttribute("data-v"));
    box.querySelectorAll(".chipopt").forEach(b => { b.disabled = all.includes(b.getAttribute("data-v")); });
  }
}

/* 技能效果小卡：停留即可看，点击可钉住；拖动画布或移动时自动收起。 */

/* 长按 / 滑动技能行 → 一张「手上的」技能卡实时跟随指针，松手落在画布上；
   轻点＝按默认位置直接添加。外层只改 left/top（不做任何过渡，写多少跟多少），
   入场缩放放在内层卡片上，两者互不干扰。 */
let pickPress = null, pickGhost = null, pickCarried = false;
const GHOST_W0 = () => GEO.skW, GHOST_H0 = () => GEO.skH;
let ghostRect = null, ghostW = GHOST_W0, ghostH = GHOST_H0;
const PICK_HOLD_MS = 220, PICK_MOVE_TOL = 8;
function cancelPickPress(){
  if(pickPress && pickPress.timer) clearTimeout(pickPress.timer);
  pickPress = null;
}
function canvasEl(){ return $("sysCanvas"); }
function setDropHint(on){
  const c = canvasEl();
  document.documentElement.classList.toggle("picking", !!pickGhost);
  if(!c) return;
  c.classList.toggle("drop-hot", !!on);
  if(pickGhost) pickGhost.el.classList.toggle("over", !!on);
}
function startPickCarry(row, cx, cy){
  if(pickGhost) return;
  cancelPickPress();
  pickCarried = true;                    // 本次按下已用于拖拽，随后的 click 不再添加
  const wrap = document.createElement("div");
  wrap.innerHTML = skillCardHtml({key:skillKeyOf(skillPickerPet, row), pet:skillPickerPet,
    sid:Number(row.id)||0, name:String(row.n||""), x:0, y:0}, "skcard");
  const card = wrap.firstElementChild;
  if(!card) return;
  const ghost = document.createElement("div");
  ghost.className = "pick-ghost";
  ghost.appendChild(card);
  // 先按估算尺寸就位再挂载，避免"挂载后同一帧再定位"被合成层吞掉
  ghost.style.left = Math.round(cx - GHOST_W0()/2) + "px";
  ghost.style.top = Math.round(cy - GHOST_H0()/2) + "px";
  document.body.appendChild(ghost);
  ghostW = ghost.offsetWidth || GEO.skW;
  ghostH = ghost.offsetHeight || 70;
  pickGhost = {el: ghost, row, w: ghostW, h: ghostH, tipW: 0, tipH: 0};
  const c = canvasEl();
  ghostRect = c ? c.getBoundingClientRect() : null;
  closeSkillPicker();                    // 拿起的同时收起列表
  setDropHint(false);
  movePickGhost(cx, cy);
  toast("拖到画布上松开即可放置");
}
/* 指针移动只记录坐标，真正的定位在下一帧统一写一次：
   pointerrawupdate + pointermove 一帧可能来十几个事件，逐个写样式反而卡。 */
let ghostRaf = 0, ghostTimer = 0, ghostX = 0, ghostY = 0;
function movePickGhost(cx, cy){
  if(!pickGhost) return;
  ghostX = cx; ghostY = cy;
  if(ghostRaf || ghostTimer) return;
  ghostRaf = requestAnimationFrame(applyGhostPos);
  // 兜底：合成器暂停/后台标签时 rAF 可能不来，40ms 后同步补一次
  ghostTimer = setTimeout(applyGhostPos, 40);
}
function applyGhostPos(){
  if(ghostRaf){ cancelAnimationFrame(ghostRaf); ghostRaf = 0; }
  if(ghostTimer){ clearTimeout(ghostTimer); ghostTimer = 0; }
  if(!pickGhost) return;
  // 卡片中心对准指针，与松手后的落点一致（所见即所得）。
  // 定位用 left/top：transform 的更新在这套页面里不会带回重排/重绘，容易出现"卡住不动"。
  pickGhost.el.style.left = Math.round(ghostX - pickGhost.w/2) + "px";
  pickGhost.el.style.top = Math.round(ghostY - pickGhost.h/2) + "px";
  const r = ghostRect;
  if(!r) return;
  const hot = ghostX >= r.left && ghostX <= r.right && ghostY >= r.top && ghostY <= r.bottom;
  if(hot !== pickGhost.hot){ pickGhost.hot = hot; setDropHint(hot); }
}
function dropPickGhost(cx, cy){
  const g = pickGhost;
  pickGhost = null;
  if(ghostRaf){ cancelAnimationFrame(ghostRaf); ghostRaf = 0; }
  if(ghostTimer){ clearTimeout(ghostTimer); ghostTimer = 0; }
  hideSkillTip();
  if(g) g.el.remove();
  const c = canvasEl();
  document.documentElement.classList.remove("picking");
  if(c) c.classList.remove("drop-hot");
  if(!g) return;
  const r = ghostRect || (c ? c.getBoundingClientRect() : null);
  if(!c || !r) return;
  const inside = cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
  if(!inside){ toast("没落在画布上，已取消"); return; }
  const k = sysZoom || 1;
  addSkillToCanvas(skillPickerPet, g.row,
    {x:(cx - r.left)/k - g.w/2, y:(cy - r.top)/k - g.h/2});
}
function cancelPickGhost(){
  if(ghostRaf){ cancelAnimationFrame(ghostRaf); ghostRaf = 0; }
  if(ghostTimer){ clearTimeout(ghostTimer); ghostTimer = 0; }
  if(pickGhost){ pickGhost.el.remove(); pickGhost = null; }
  hideSkillTip();
  const c = canvasEl();
  document.documentElement.classList.remove("picking");
  if(c) c.classList.remove("drop-hot");
  cancelPickPress();
}

/* pointerrawupdate 在支持的浏览器里给出更高频的坐标，拖拽更贴手；不支持时退回 pointermove */
window.addEventListener("pointerrawupdate", e => {
  if(pickGhost) movePickGhost(e.clientX, e.clientY);
});
window.addEventListener("pointermove", e => {
  if(pickGhost){ movePickGhost(e.clientX, e.clientY); return; }   // 已在手上：每次移动直接跟

(function bindNoteBoxDrag(){
  const box = $("canvasNoteEdit");
  const head = $("canvasNoteHead");
  head.addEventListener("pointerdown", e => {

    if(!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY) ||
       (e.clientX === 0 && e.clientY === 0)) return;
    const dx = e.clientX - noteBoxDrag.sx, dy = e.clientY - noteBoxDrag.sy;
    if(Math.abs(dx) > 2400 || Math.abs(dy) > 2400) return;
    const x = Math.max(8, Math.min(noteBoxDrag.ox + dx, window.innerWidth - box.offsetWidth - 8));

    if(!noteBoxDrag) return;
    head.classList.remove("drag");
    try{ head.releasePointerCapture(noteBoxDrag.pointerId); }catch(ex){}
    noteBoxDrag = null;
  };

  document.addEventListener("pointerup", end);
})();

/* ---------- 单个体系文件：导出 / 导入（一个体系一个 .json，可跨设备转发） ---------- */
const SYS_FILE_SCHEMA = "seer-system/1";
const safeFileName = s => String(s || "体系").replace(/[\\/:*?"<>|\r\n]+/g, "_").trim() || "体系";

function sysExportPayload(){
  const base = sysData() || {};
  const draft = sysValues();
  const key = String(sysEditing || base.key || draft.name || "").trim();
  if(!key) return null;
  const item = Object.assign({}, base, draft, {key, name: base.name || draft.name || key});
  if(base.kind) item.kind = base.kind;
  const body = String(draft.section_note || "").trim();
  if(body) item.body = body;
  delete item.section_note;
  const members = [].concat(item.core || [], item.support || [], item.counter || [])
    .map(id => ({id: Number(id), name: (nodeOf(String(id)) || {}).name || ""}));
  return Object.assign({$schema: SYS_FILE_SCHEMA,
    exported_at: new Date().toISOString().slice(0, 19), members}, item);
}

function exportSystemFile(){
  const payload = sysExportPayload();
  if(!payload){ toast("先给体系起个名字（或打开已有体系）再导出"); return; }
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = safeFileName(payload.key) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("已导出：" + a.download);
}

/* 兼容三种文件：带 $schema 的导出文件 / 裸 system 对象 / {system:{...}} */
function normalizeSystemFile(obj){
  if(!obj || typeof obj !== "object") return null;
  const s = (obj.system && typeof obj.system === "object") ? obj.system : obj;
  if(!s || typeof s !== "object") return null;
  if(!s.key && s.name) s.key = s.name;
  if(!s.key || typeof s.key !== "string") return null;
  s.name = String(s.name || s.key);
  if(!Array.isArray(s.core)) s.core = [];
  if(!Array.isArray(s.support)) s.support = [];
  if(!Array.isArray(s.counter)) s.counter = [];
  delete s.$schema;
  delete s.exported_at;
  delete s.members;
  return s;
}

function upsertSystem(item){
  const key = String(item.key);
  systemState.create = (systemState.create || []).filter(x => String(x.key) !== key).concat([item]);
  systemState.delete = (systemState.delete || []).filter(x => String(x) !== key);
  systemState.overwrite = (systemState.overwrite || []).filter(x => String(x.key) !== key);
  if(systemState.edits) delete systemState.edits[key];
}

async function importSystemFiles(files){
  const list = Array.from(files || []).filter(f => /\.json$/i.test(f.name || ""));
  if(!list.length){ toast("没有可导入的 .json 文件"); return; }
  const ok = [], bad = [];
  for(const f of list){
    try{
      const item = normalizeSystemFile(JSON.parse(await f.text()));
      if(!item) throw new Error("不是体系文件");
      ok.push(item);
    }catch(e){ bad.push(f.name); }
  }
  if(!ok.length){ toast("导入失败：" + bad.slice(0, 3).join("、") + " 里没有体系数据"); return; }
  const exists = ok.filter(s => (DATA.systems || []).some(x => String(x.key) === String(s.key)));
  if(exists.length && !confirm("以下体系本机已存在，导入会覆盖：\n" +
      exists.map(s => s.key).join("、") + "\n\n继续导入？")) return;
  ok.forEach(upsertSystem);
  saveSystems();
  applySystemState();
  renderAll();
  const missing = ok.reduce((n, s) => n + [].concat(s.core, s.support, s.counter)
    .filter(id => !nodeOf(String(id))).length, 0);
  toast("已导入 " + ok.length + " 个体系" +
    (bad.length ? "（跳过 " + bad.length + " 个无效文件）" : "") +
    (missing ? "；其中 " + missing + " 个成员不在本地精灵库，画布上会留空位" : ""));
}

(function bindCanvas(){
  const canvas = $("sysCanvas");
  canvas.addEventListener("contextmenu", e => {
    e.preventDefault();
    const note = e.target.closest(".cnote");
    const card = e.target.closest(".cnode");
    const skEl = e.target.closest(".skcard");
    const label = e.target.closest(".clabel");
    if(note){ openNoteMenu(note.getAttribute("data-id"), e.clientX, e.clientY); return; }
    if(skEl){ openSkMenu(skEl.getAttribute("data-skey"), e.clientX, e.clientY); return; }
    if(card){ openNodeMenu(card.getAttribute("data-id"), e.clientX, e.clientY); return; }
    if(label) return;                     // 连线标签有自己的右键菜单
    closeNodeMenu(); closeEdgeMenu(); closeNoteMenu(); cancelLinkMode();
    const p = pos(e);
    openCanvasNote(Math.max(4, p.x), Math.max(4, p.y), null);
  });
  /* 备注文本拖动：写回 graph.notes 的 x/y，随 canvas.notes 落库。 */
  function noteMove(e){
    if(!noteDrag) return;
    // 与精灵卡一致：异常坐标会让备注文本突然跳到左上角，直接忽略。
    if(!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY) ||
       (e.clientX === 0 && e.clientY === 0)) return;
    const p = pos(e);
    const dx = p.x - noteDrag.sx, dy = p.y - noteDrag.sy;
    if(Math.abs(dx) > 2400 || Math.abs(dy) > 2400) return;
    const row = (graph.notes||[]).find(n => String(n.id) === noteDrag.id);
    if(!row) return;
    row.x = Math.max(4, Math.min(noteDrag.ox + dx, Math.max(4, canvas.clientWidth - 210)));
    row.y = Math.max(4, Math.min(noteDrag.oy + dy, COORD_MAX));
    const el = canvas.querySelector(`.cnote[data-id="${CSS.escape(noteDrag.id)}"]`);
    if(el){ el.style.left = row.x+"px"; el.style.top = row.y+"px"; }
    drawEdges();                  // 备注文本下移时画布高度与 viewBox 同步撑开
  }
  function noteEnd(){
    if(!noteDrag) return;
    const el = canvas.querySelector(`.cnote[data-id="${CSS.escape(noteDrag.id)}"]`);
    if(el){
      el.classList.remove("drag");
      try{ el.releasePointerCapture(noteDrag.pointerId); }catch(ex){}
    }
    noteDrag = null;
    drawEdges();                  // 结束时不重算坐标，保持最后一次有效位置
  }
  function moveTo(e){
    if(!drag) return;
    // 异常坐标（合成事件 / 指针捕获丢失 / clientX=0）会让卡片突然跳到左上角，直接忽略。
    if(!Number.isFinite(e.clientX) || !Number.isFinite(e.clientY) ||
       (e.clientX === 0 && e.clientY === 0)) return;
    const p = pos(e);
    const dx = p.x - drag.sx, dy = p.y - drag.sy;
    if(Math.abs(dx) > 2400 || Math.abs(dy) > 2400) return;
    const nd = objByKey(drag.key); if(!nd) return;
    const isSkill = isSkillKey(drag.key);
    const w = isSkill ? (nd.w || GEO.skW) : GEO.editW, h = isSkill ? (nd.h || GEO.skH) : GEO.editH;
    nd.x = Math.max(4, Math.min(drag.ox + dx, Math.max(4, canvas.clientWidth - w - 8)));
    nd.y = Math.max(4, Math.min(drag.oy + dy, Math.max(4, canvas.clientHeight - h - 12)));
    if(drag.el){ drag.el.style.left = nd.x+"px"; drag.el.style.top = nd.y+"px"; }
    drawEdges();
  }
  function endDrag(){
    if(!drag) return;
    const card = drag.el;
    if(card){
      card.classList.remove("drag");
      try{ card.releasePointerCapture(drag.pointerId); }catch(e){}
    }
    drag = null;
    drawEdges();          // 结束时不再用事件坐标重算位置，保持最后一次有效坐标
  }
  canvas.addEventListener("pointerdown", e => {
    if(e.button !== 0) return;
    const noteEl = e.target.closest(".cnote");
    if(noteEl){
      // 连线模式：点备注文本即完成连线（备注文本可从任一端发起），不启动拖动。
      if(linkFrom != null){
        const nid = String(noteEl.getAttribute("data-id"));
        if(nid !== String(linkFrom)) addEdge(linkFrom, nid);
        cancelLinkMode();
        return;
      }
      const row = (graph.notes||[]).find(n => String(n.id) === String(noteEl.getAttribute("data-id")));
      const np = pos(e);
      if(row && Number.isFinite(np.x) && Number.isFinite(np.y)){
        noteDrag = {id:String(row.id), ox:Number(row.x)||0, oy:Number(row.y)||0,
          sx:np.x, sy:np.y, pointerId:e.pointerId};
        noteEl.classList.add("drag");
        try{ noteEl.setPointerCapture(e.pointerId); }catch(ex){}
        noteEl.addEventListener("pointermove", noteMove);
        noteEl.addEventListener("pointerup", noteEnd);
        noteEl.addEventListener("pointercancel", noteEnd);
        e.preventDefault();
      }
      return;
    }
    const card = e.target.closest(".cnode, .skcard");
    const keyOf = el => el.classList.contains("skcard") ? el.getAttribute("data-skey") : el.getAttribute("data-id");
    // 连线模式：再点另一张卡即完成连线，不启动拖动、不改动任何位置。
    if(linkFrom != null){
      if(card && keyOf(card) !== String(linkFrom)) addEdge(linkFrom, keyOf(card));
      cancelLinkMode();
      return;
    }
    if(!card) return;
    const key = keyOf(card);
    const nd = objByKey(key); if(!nd) return;
    const p = pos(e);
    if(!Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
    drag = {key, el:card, ox:nd.x, oy:nd.y, sx:p.x, sy:p.y, pointerId:e.pointerId};
    card.classList.add("drag");
    // 指针捕获：即使拖出画布也持续收到 move/up，避免坐标突变或事件丢失。
    try{ card.setPointerCapture(e.pointerId); }catch(e){}
    card.addEventListener("pointermove", moveTo);
    card.addEventListener("pointerup", endDrag);
    card.addEventListener("pointercancel", endDrag);
    e.preventDefault();
  });
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointerup", noteEnd);
  document.addEventListener("pointercancel", endDrag);
  document.addEventListener("pointercancel", noteEnd);
  canvas.addEventListener("dblclick", e => {
    const c = e.target.closest(".cnode");
    if(c){ removeNode(c.getAttribute("data-id")); return; }
    const s = e.target.closest(".skcard");
    if(s) removeSkill(s.getAttribute("data-skey"));
  });
  // 从左侧结果拖进画布
  $("sysResults").addEventListener("dragstart", e => {
    const b = e.target.closest(".sres"); if(!b) return;
    e.dataTransfer.setData("text/plain", b.getAttribute("data-id"));
    e.dataTransfer.effectAllowed = "copy";
  });
  canvas.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  canvas.addEventListener("drop", e => {
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    if(id) addNodeAt(id, pos(e).x, pos(e).y);
  });
  function pos(ev){
    const r = canvas.getBoundingClientRect();
    const k = sysZoom || 1;   // 画布按 sysZoom 缩放过，视觉差要换回原始 px
    return {x: (ev.clientX - r.left) / k, y: (ev.clientY - r.top) / k};
  }
})();

/* ---------- 深色模式：跟随系统，可手动切换并记住选择 ---------- */
const THEME_KEY = "seer_peak_view_theme";
function savedTheme(){
  try { const v = localStorage.getItem(THEME_KEY); return (v === "dark" || v === "light") ? v : null; }
  catch(e){ return null; }
}
function systemTheme(){
  try { return matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"; }
  catch(e){ return "light"; }
}
function applyTheme(mode){
  const t = (mode === "dark" || mode === "light") ? mode : systemTheme();
  document.documentElement.setAttribute("data-theme", t);
  const btn = $("btnTheme");
  if(btn){
    const dark = t === "dark";
    btn.setAttribute("aria-pressed", dark ? "true" : "false");
    btn.title = dark ? "切换到浅色模式" : "切换到深色模式";
    btn.setAttribute("aria-label", btn.title);
  }
  return t;
}
function currentTheme(){
  return document.documentElement.getAttribute("data-theme") || systemTheme();
}
(function initTheme(){
  applyTheme(savedTheme());
  const btn = $("btnTheme");
  if(btn) btn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });
  try {
    const mq = matchMedia("(prefers-color-scheme:dark)");
    const onSys = () => { if(!savedTheme()) applyTheme(); };   // 没手动选过才跟着系统变
    mq.addEventListener ? mq.addEventListener("change", onSys) : mq.addListener(onSys);
  } catch(e){}
})();
